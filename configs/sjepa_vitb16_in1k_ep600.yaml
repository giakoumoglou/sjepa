data:
  batch_size: 512
  color_jitter_strength: 0.0
  copy_data: false
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  image_folder: imagenet/
  num_workers: 10
  pin_mem: true
  root_path: $path_to_datasets
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
logging:
  folder: $path_to_logs/sjepa-vitb16.224-ep.600/
  write_tag: sjepa
mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 16
  pred_mask_scale:
  - 0.15
  - 0.2
  strategy: multiblock
meta:
  load_checkpoint: true
  read_checkpoint: null
  model_name: vit_base
  pred_depth: 6
  pred_emb_dim: 384
  use_bfloat16: true
  stochastic: true
  latent_dim: $sjepa_latent_dim
  kl_beta_final: $sjepa_kl_beta_final
  kl_beta_warmup_frac: $sjepa_kl_beta_warmup_frac
  kl_free_bits: $sjepa_kl_free_bits
optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 600
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.001
  start_lr: 0.0002
  use_ema: true
  warmup: 40
  weight_decay: 0.04
